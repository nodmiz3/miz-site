<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FMBE Add-on Generator</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; padding:20px; }
input, select { width: 100%; padding:8px; margin:6px 0; background:#222; color:#fff; border:1px solid #444; }
button { padding:10px 20px; background:#4caf50; border:none; color:#fff; cursor:pointer; }
textarea { width:100%; height:160px; background:#000; color:#0f0; padding:10px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<h2>FMBE Add-on Generator</h2>

<label>アドオン名</label>
<input id="addonName" value="FMBE_Display_Addon">

<label>ブロックID</label>
<input id="blockId" value="minecraft:stone">

<label>Preset</label>
<select id="preset">
  <option value="3D">3D</option>
  <option value="Flat">Flat</option>
  <option value="Item">Item</option>
</select>

<button onclick="generateAddon()">アドオンを生成</button>

<script>
function generateAddon() {
  const name = document.getElementById("addonName").value;
  const block = document.getElementById("blockId").value;
  const preset = document.getElementById("preset").value;

  const zip = new JSZip();

  // BP
  const bp = zip.folder("behavior_pack");
  bp.file("manifest.json", `
{
  "format_version": 2,
  "header": {
    "name": "${name}",
    "description": "Generated FMBE Add-on",
    "uuid": "11111111-2222-3333-4444-555555555555",
    "version": [1,0,0],
    "min_engine_version": [1,21,0]
  },
  "modules": [
    {
      "type": "script",
      "uuid": "66666666-7777-8888-9999-000000000000",
      "version": [1,0,0],
      "entry": "scripts/fmbe.js"
    },
    {
      "type": "data",
      "uuid": "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee",
      "version": [1,0,0]
    }
  ]
}
  `);

  bp.folder("scripts").file("fmbe.js", `
import { world } from "@minecraft/server";

world.afterEvents.chatSend.subscribe(ev => {
  const msg = ev.message.split(" ");
  if (msg[0] === "!display") {
    const e = world.spawnEntity("fmbe:display", ev.sender.location);
    e.setDynamicProperty("block:id", "${block}");
    e.setDynamicProperty("preset", "${preset}");
    ev.sender.sendMessage("§aDisplay created: ${block} (${preset})");
  }
});
  `);

  bp.folder("entities").file("fmbe_display.json", `
{
  "format_version": "1.21.0",
  "minecraft:entity": {
    "description": {
      "identifier": "fmbe:display",
      "is_spawnable": false,
      "is_summonable": true,
      "geometry": "geometry.fmbe.display"
    }
  }
}
  `);

  // RP
  const rp = zip.folder("resource_pack");
  rp.file("manifest.json", `
{
  "format_version": 2,
  "header": {
    "name": "${name} RP",
    "description": "Generated FMBE RP",
    "uuid": "bbbbbbbb-cccc-dddd-eeee-ffffffffffff",
    "version": [1,0,0],
    "min_engine_version": [1,21,0]
  },
  "modules": [
    {
      "type": "resources",
      "uuid": "12345678-90ab-cdef-1234-567890abcdef",
      "version": [1,0,0]
    }
  ]
}
  `);

  rp.folder("models/entity").file("fmbe_display.geo.json", `
{
  "format_version": "1.21.0",
  "minecraft:geometry": [
    {
      "description": {
        "identifier": "geometry.fmbe.display",
        "texture_width": 16,
        "texture_height": 16
      },
      "bones": [
        { "name": "root", "pivot": [0,0,0], "cubes": [] }
      ]
    }
  ]
}
  `);

  zip.generateAsync({type:"blob"}).then(function(content) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = name + ".mcaddon";
    a.click();
  });
}
</script>

</body>
</html>
